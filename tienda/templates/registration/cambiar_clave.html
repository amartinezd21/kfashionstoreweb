{% extends "tienda/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h4">Cambiar contraseña</h1>
  <form method="post" class="card card-body shadow-sm">{% csrf_token %}
    {% for f in form %}
      <label class="form-label">{{ f.label }}</label>
      <input type="password" name="{{ f.html_name }}" class="form-control mb-1" required>
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      <div class="mb-2"></div>
    {% endfor %}
    <button class="btn btn-kf">Guardar</button>
  </form>
</div></div>
{% endblock %}
