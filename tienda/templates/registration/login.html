{% extends "tienda/base.html" %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4">
  <h1 class="h3 text-center mb-1" style="color:#b03a6f">K Fashion Store</h1>
  <p class="text-center text-muted">Control de inventario y finanzas</p>
  <form method="post" class="card card-body shadow-sm">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <label class="form-label">Usuario</label>
    <input name="username" class="form-control mb-3" autofocus required>
    <label class="form-label">Contraseña</label>
    <input name="password" type="password" class="form-control mb-3" required>
    <button class="btn btn-kf">Entrar</button>
  </form>
</div></div>
{% endblock %}
