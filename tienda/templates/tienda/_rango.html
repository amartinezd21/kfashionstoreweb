<form class="d-flex flex-wrap align-items-end gap-2 mb-3 no-print">
  <div>
    <label class="d-block" for="rango-desde">Desde</label>
    <input id="rango-desde" type="date" name="desde" value="{% if r.desde %}{{ r.desde|date:'Y-m-d' }}{% else %}{{ desde|date:'Y-m-d' }}{% endif %}" class="form-control">
  </div>
  <div>
    <label class="d-block" for="rango-hasta">Hasta</label>
    <input id="rango-hasta" type="date" name="hasta" value="{% if r.hasta %}{{ r.hasta|date:'Y-m-d' }}{% else %}{{ hasta|date:'Y-m-d' }}{% endif %}" class="form-control">
  </div>
  <button type="submit" class="kfp-btn"><i class="ti ti-filter"></i> Consultar</button>
</form>
