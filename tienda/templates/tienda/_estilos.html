<style>
  /* ===== Sistema de Diseño Unificado K Fashion Store ===== */
  body, body.bg-light {
    background-color: #f7eed9 !important;
    color: #5a0f2e;
    font-family: 'Jost', sans-serif;
  }

  .kfp {
    --vino: #5a0f2e;
    --vino-hover: #460b24;
    --crema: #f7eed9;
    --crema-clara: #fbf6eb;
    --durazno: #fdbda0;
    --durazno-suave: rgba(253, 189, 160, 0.25);
    --suave: rgba(90, 15, 46, 0.72);
    --borde: rgba(253, 189, 160, 0.9);
    --sombra: 0 4px 20px rgba(90, 15, 46, 0.05);
    color: var(--vino);
    font-variant-numeric: lining-nums;
  }

  .kfp a {
    color: var(--vino);
    transition: color 0.15s ease, opacity 0.15s ease;
  }

  .kfp a:focus-visible,
  .kfp button:focus-visible,
  .kfp input:focus-visible,
  .kfp select:focus-visible,
  .kfp textarea:focus-visible {
    outline: 2px solid var(--vino);
    outline-offset: 2px;
  }

  .kfp-num {
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }

  .kfp-suave { color: var(--suave); }

  /* Barra de contexto + encabezado banner */
  .kfp-contexto {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--suave);
    margin-bottom: 16px;
  }

  .kfp-contexto a {
    color: var(--suave);
    text-decoration: none;
  }

  .kfp-contexto a:hover {
    color: var(--vino);
    text-decoration: underline;
  }

  .kfp-contexto-derecha {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }

  .kfp-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(253, 189, 160, 0.6);
    border: 1px solid rgba(90, 15, 46, 0.15);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--vino);
  }

  .kfp-encabezado {
    background: linear-gradient(135deg, #fdbda0 0%, #fcc9b1 100%);
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 20px 26px;
    margin-bottom: 22px;
    box-shadow: 0 2px 12px rgba(90, 15, 46, 0.06);
  }

  .kfp-titulo {
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .kfp-subtitulo {
    font-size: 13.5px;
    color: rgba(90, 15, 46, 0.8);
    margin: 4px 0 0;
  }

  /* Botones */
  .kfp-btn {
    background: var(--vino);
    color: var(--crema) !important;
    border: 1px solid var(--vino);
    border-radius: 100px;
    height: 42px;
    padding: 0 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  }

  .kfp-btn:hover:not(:disabled) {
    background: var(--vino-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(90, 15, 46, 0.18);
  }

  .kfp-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .kfp-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .kfp-btn-claro {
    background: var(--crema-clara);
    color: var(--vino) !important;
    border: 1px solid rgba(90, 15, 46, 0.35);
  }

  .kfp-btn-claro:hover:not(:disabled) {
    background: rgba(253, 189, 160, 0.45);
    border-color: var(--vino);
    box-shadow: none;
  }

  .kfp-btn-durazno {
    background: var(--durazno);
    color: var(--vino) !important;
    border: 1px solid rgba(90, 15, 46, 0.28);
    height: 36px;
    padding: 0 14px;
    font-size: 12.5px;
  }

  .kfp-btn-durazno:hover:not(:disabled) {
    background: #feb99a;
    border-color: var(--vino);
  }

  .kfp-link {
    font-size: 12.5px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .kfp-link:hover { text-decoration: underline; }

  /* Pastillas (filtros) */
  .kfp-selector {
    background: rgba(253, 189, 160, 0.25);
    border-radius: 100px;
    padding: 4px;
    display: inline-flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .kfp-pill {
    background: var(--crema-clara);
    border: 1px solid rgba(90, 15, 46, 0.22);
    border-radius: 100px;
    padding: 7px 14px;
    font-size: 12.5px;
    color: var(--suave) !important;
    text-decoration: none;
    line-height: 1.25;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  .kfp-pill:hover {
    background: rgba(253, 189, 160, 0.5);
    color: var(--vino) !important;
  }

  .kfp-pill.activa {
    background: var(--vino);
    border-color: var(--vino);
    color: var(--crema) !important;
    font-weight: 500;
  }

  /* Tarjetas */
  .kfp-tarjeta {
    background: var(--crema-clara);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--sombra);
  }

  .kfp-tarjeta h2 {
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.25;
    margin: 0;
  }

  .kfp-tarjeta-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .kfp-oscura {
    background: var(--vino);
    color: var(--crema);
    border-radius: 16px;
    padding: 24px 26px;
    box-shadow: 0 6px 24px rgba(90, 15, 46, 0.16);
  }

  .kfp-suave-caja {
    background: rgba(253, 189, 160, 0.25);
    border: 1px solid rgba(253, 189, 160, 0.6);
    border-radius: 12px;
    padding: 14px 18px;
  }

  .kfp-etiqueta {
    background: rgba(253, 189, 160, 0.35);
    border-radius: 100px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .kfp-oscura .kfp-etiqueta {
    background: rgba(247, 238, 217, 0.18);
    color: var(--crema);
  }

  /* Badges semánticos */
  .kfp-badge {
    border-radius: 100px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .kfp-badge-exito   { background: #e2f3ea; color: #165936; }
  .kfp-badge-alerta  { background: #fef3dc; color: #92540a; }
  .kfp-badge-peligro { background: #fbe4e4; color: #8c1417; }
  .kfp-badge-info    { background: #e3f2f8; color: #0c5460; }
  .kfp-badge-neutro  { background: rgba(90, 15, 46, 0.08); color: var(--vino); }

  .kfp-talla {
    background: rgba(253, 189, 160, 0.35);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .kfp-punto {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: inline-block;
    vertical-align: -2px;
    flex-shrink: 0;
    border: 1px solid rgba(90, 15, 46, 0.25);
  }

  .kfp-nota {
    font-size: 12px;
    color: var(--suave);
    margin: 10px 0 0;
  }

  /* Tablas */
  .kfp-tabla-caja {
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow-x: auto;
    background: var(--crema-clara);
  }

  .kfp-tabla {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    color: var(--vino);
  }

  .kfp-tabla th {
    background: rgba(253, 189, 160, 0.45);
    color: var(--vino);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 12px 14px;
    text-align: left;
    white-space: nowrap;
  }

  .kfp-tabla td {
    padding: 12px 14px;
    border-top: 1px solid rgba(253, 189, 160, 0.5);
    vertical-align: middle;
  }

  .kfp-tabla tbody tr:nth-child(even) td {
    background: rgba(253, 189, 160, 0.1);
  }

  .kfp-tabla tbody tr:hover td {
    background: rgba(253, 189, 160, 0.28);
  }

  .kfp-tabla .derecha { text-align: right; }
  .kfp-tabla .vacio { text-align: center; color: var(--suave); padding: 28px 16px; }
  .kfp-tabla small { font-size: 11.5px; color: var(--suave); }

  /* Formularios */
  .kfp label, .kfp .form-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--vino);
    margin-bottom: 6px;
  }

  .kfp .form-control, .kfp .form-select, .kfp-input {
    background-color: #fff;
    border: 1px solid rgba(90, 15, 46, 0.22);
    border-radius: 10px;
    color: var(--vino);
    min-height: 42px;
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .kfp .form-control:focus, .kfp .form-select:focus, .kfp-input:focus {
    background-color: #fff;
    border-color: var(--vino);
    box-shadow: 0 0 0 3px rgba(90, 15, 46, 0.12);
    color: var(--vino);
    outline: none;
  }

  .kfp .form-control::placeholder { color: rgba(90, 15, 46, 0.42); }
  .kfp .form-check-input:checked { background-color: var(--vino); border-color: var(--vino); }
  .kfp .errorlist, .kfp-error { color: #a4161a; font-size: 12px; font-weight: 500; margin-top: 4px; }
  .kfp .errorlist { list-style: none; padding: 0; }

  /* Paginación */
  .kfp-paginas {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--suave);
  }
  .kfp-paginas-botones { display: flex; align-items: center; gap: 8px; }

  /* Responsive */
  @media (max-width: 767.98px) {
    .kfp-encabezado { padding: 16px 18px; }
    .kfp-titulo { font-size: 30px; }
    .kfp-contexto { flex-wrap: wrap; }
    .kfp-tarjeta { padding: 16px; }
    .kfp-btn { width: 100%; }
    .kfp-encabezado .kfp-btn { width: auto; }
  }

  @media print {
    body, body.bg-light { background: #fff !important; }
    .kfp-tarjeta { box-shadow: none; border-color: #ddd; }
  }
</style>
